[project]

name = "cart-dl"
version = "0.8.0"
description = "Cart-dl: Switch ROM downloader with IGDB quality filtering"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

authors = [
    {name = "bbtufty"},
]
maintainers = [
    {name = "bbtufty"},
]

classifiers = [
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 3 - Alpha",

    # License
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "beautifulsoup4 == 4.14.3",
    "colorlog == 6.10.1",
    "curl_cffi == 0.13.0",
    "discordwebhook == 1.0.3",
    "fastapi >= 0.110.0",
    "logredactor == 0.0.2",
    "lxml == 6.0.2",
    "myjdapi == 1.1.10",
    "numpy == 2.3.5",
    "pathvalidate == 3.3.1",
    "PySide6 == 6.10.1",
    "requests == 2.32.5",
    "PyYAML == 6.0.3",
    "sse-starlette >= 2.0.0",
    "uvicorn[standard] >= 0.30.0",
]

[project.scripts]
cart-dl = "cart_dl.server:run_server"
cart-dl-gui = "cart_dl:run_CartDL_gui"

[project.optional-dependencies]
docs = [
    "sphinx == 8.2.3",
    "sphinx-automodapi == 0.20.0",
    "sphinx-rtd-theme == 3.0.2",
]

[project.urls]
"Homepage" = "https://git.johagan.au/jack/cart-dl"
"Bug Reports" = "https://git.johagan.au/jack/cart-dl/issues"
"Source" = "https://git.johagan.au/jack/cart-dl"

[tool.setuptools.packages.find]
exclude = ["log/*"]

[build-system]
requires = [
    "setuptools>=43.0.0",
    "wheel>=0.43.0",
    "setuptools_scm>=8.1.0",
]

build-backend = "setuptools.build_meta"