# Platform definitions for cart-dl
# Extensions listed in preference order (compressed/lossless first)

platforms:
  switch:
    display: "Nintendo Switch"
    extensions: [".nsp", ".xci", ".nsz", ".xcz"]
    preferred_extensions: [".nsp", ".xci"]
    filetype_regex:
      base: ["NSP", "XCI", "NSZ"]
      update: ["Update"]
      dlc: ["DLC"]
    sources:
      http:
        - name: "nxbrew.net"
          url: "https://nxbrew.net"
          index_path: "game-index/"
          parser: "az_listing"
        - name: "nswgame.com"
          url: "https://nswgame.com"
          index_path: "list-all-game-switch/"
          parser: "nswgame"
        - name: "switch-roms.com"
          url: "https://switch-roms.com"
          index_path: "post-sitemap.xml"
          parser: "sitemap"
        - name: "ziperto.com"
          url: "https://www.ziperto.com"
          index_path: "category/nintendo-switch-nsp/"
          parser: "ziperto"
      torrent:
        - name: "minerva"
          collection: "No-Intro/Nintendo - Nintendo Switch"
      archive:
        - name: "ia"
          collection: "No-Intro-Nintendo-Nintendo-Switch"
          identifier: "nsw-No-Intro-Nintendo-Nintendo-Switch"
    download_methods: ["http", "torrent", "archive"]

  wiiu:
